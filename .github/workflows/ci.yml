name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore RockULA.slnx
      - name: Build
        run: dotnet build RockULA.slnx -c Release --no-restore
      - name: Test
        run: dotnet test RockULA.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Headless status
        run: dotnet run --project src/RockULA.Headless -c Release --no-build -- --about
      - name: Check formatting
        if: runner.os == 'Linux'
        run: dotnet format RockULA.slnx --verify-no-changes --no-restore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
