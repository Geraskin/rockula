name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore RockULA.slnx
      - name: Build
        run: dotnet build RockULA.slnx -c Release --no-restore
      - name: Test
        run: dotnet test RockULA.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Headless status
        run: dotnet run --project src/RockULA.Headless -c Release --no-build -- --about
      - name: Synthetic CPU demo
        run: dotnet run --project src/RockULA.Headless -c Release --no-build -- --demo
      - name: Synthetic loop and stack demo
        run: dotnet run --project src/RockULA.Headless -c Release --no-build -- --demo-loop
      - name: Synthetic 48K SNA machine demo
        run: dotnet run --project src/RockULA.Headless -c Release --no-build -- --demo-machine
      - name: Synthetic Z80 v3 machine demo
        run: dotnet run --project src/RockULA.Headless -c Release --no-build -- --demo-z80
      - name: Native audio and virtual joystick smoke
        env:
          SDL_AUDIODRIVER: dummy
        run: dotnet run --project src/RockULA.Desktop -c Release --no-build -- --smoke-devices
      - name: Desktop native-window smoke
        if: runner.os == 'Linux'
        env:
          SDL_AUDIODRIVER: dummy
        run: timeout 30s xvfb-run -a dotnet run --project src/RockULA.Desktop -c Release --no-build -- --smoke-gui
      - name: Check formatting
        if: runner.os == 'Linux'
        run: dotnet format RockULA.slnx --verify-no-changes --no-restore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
